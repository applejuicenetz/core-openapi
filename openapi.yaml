          type: string
      - name: countshares
        in: query
        required: false
        description: Löscht explizite Shareliste, fügt Incoming immer rekursiv hinzu, dann sharedirectoryN/sharesubN
          absteigend von N bis 1. Auch 0/negative Werte löschen Liste bis auf Incoming. Danach Share-Scan.
        schema:
          type: integer
          format: int64
      - name: sharedirectory1
