  /function/setsettings:
    get:
      tags:
      - function
      summary: Core-Einstellungen ändern und speichern
      operationId: setSettings
      description: Alle Parameter optional, fehlende Werte bleiben. Reihenfolge der Auswertung (nickname,
        port, xmlport, autoconnect, Upload-/Download-/Verbindungslimits, Quellen, maxnewconnectionsperturn,
        speedperslot, Incoming, Temp, Shares). Kein atomarer Patch, kein Rollback. Anschließend settings.xml
        lesen für tatsächlich gesetzte Werte. Änderungen an Ports/Verzeichnissen sind riskant und können Verbindung/Transfers
        beeinflussen.
      parameters:
      - name: nickname
        in: query
        required: false
        description: Neuer Nickname; leerer Wert wird ignoriert.
        schema:
          type: string
      - name: port
        in: query
        required: false
        description: TCP-Port ändern; Listener wird neu gestartet, Server-Neuverbindung kann nötig sein.
        schema:
          type: integer
          format: int64
      - name: xmlport
        in: query
        required: false
        description: HTTP-Port ändern; Listener wird neu gestartet. Laufende Verbindung kann betroffen sein,
          neue Requests an neuen Port.
        schema:
          type: integer
          format: int64
      - name: autoconnect
        in: query
        required: false
        description: Case-insensitive true setzt true; jeder andere Wert setzt false. Setter ändert Flag, ruft
          selbst kein startMonitoring auf.
        schema:
          type: string
      - name: maxupload
        in: query
        required: false
        description: Bytes/Sekunde; Mindestwert 3072. Ändert auch effektive speedperslot-Grenzen.
        schema:
          type: integer
          format: int64
      - name: maxdownload
        in: query
        required: false
        description: Bytes/Sekunde; negative Werte werden 0 (unbegrenzt).
        schema:
          type: integer
          format: int64
      - name: maxconnections
        in: query
        required: false
        description: Mindestwert 30.
        schema:
          type: integer
          format: int64
      - name: maxsourcesperfile
        in: query
        required: false
        description: Ganzzahl, Setter übernimmt ohne Bereichsprüfung.
        schema:
          type: integer
          format: int64
      - name: maxnewconnectionsperturn
        in: query
        required: false
        description: Je 10 s, wird auf 1..200 begrenzt.
        schema:
          type: integer
          format: int64
      - name: speedperslot
        in: query
        required: false
        description: 'KiB/Sekunde. Effektiver Wert wird abhängig von maxupload begrenzt: gerundete Potenzen
          0.2 und 0.6 von ganzzahlig maxupload/1024.'
