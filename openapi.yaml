      parameters:
      - $ref: '#/components/parameters/Mode'
      responses:
        '200':
          $ref: '#/components/responses/wrongsessionResult'
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  description: Nur case-insensitive zip aktiviert zlib; alle anderen Werte werden ignoriert.
    options:
      tags:
      - http
      summary: CORS-Preflight (ohne Authentifizierung)
      operationId: wrongsessionOptions
      description: OPTIONS wird vor Authentifizierung und Routing behandelt; gleiches Verhalten auch auf unbekannten
        Pfaden. TCP-Zugangsbeschränkung gilt weiterhin.
      security: []
      parameters:
      - $ref: '#/components/parameters/Mode'
      responses:
        '200':
          $ref: '#/components/responses/Preflight'
components:
  securitySchemes:
    PasswordHeader:
      type: apiKey
      in: header
      name: X-AppleJuice-Password
      description: MD5 des Core-Passworts. Empfohlener Transport; auch localhost braucht den Hash.
        Vorhandener Header hat Vorrang vor Query und POST-Form, auch bei leerem oder falschem Wert.
    PasswordQuery:
      type: apiKey
      in: query
      name: password
      description: MD5 des Core-Passworts. Kompatibler Fallback ohne X-AppleJuice-Password-Header;
        auch localhost braucht den Hash; kein HTTP Basic/Bearer. POST alternativ Formfeld password akzeptiert.
  parameters:
    Mode:
      name: mode
      in: query
      required: false
      description: Nur case-insensitive zip aktiviert zlib; alle anderen Werte werden ignoriert.
      schema:
        type: string
    Id:
      name: id
      in: query
      required: false
      description: 'Objekt-ID. Fehlend/ungültig: funktionsspezifischer Fehler oder ID 0/-1. Für erfolgreichen
        Aufruf positive passende Objekt-ID verwenden.'
      schema:
        type: integer
        format: int64
    AdditionalIds:
      name: id1
      in: query
      required: false
      description: Fortlaufend id1, id2, ...; Stopp bei erster Lücke. Nicht Array id=1&id=2. Nichtnumerische
        Werte werden übersprungen. Antworten werden ohne Trenner verkettet. id ist nicht zwingend, id1 allein
        funktioniert.
      schema:
        type: integer
        format: int64
    Timestamp:
      name: timestamp
      in: query
      required: false
      description: Millisekunden seit Unix-Epoche; ungültig/fehlend = 0. Objekte mit Änderungszeit >= timestamp
        (inklusiv). time der letzten Antwort beim nächsten Poll senden.
      schema:
        type: integer
        format: int64
        default: 0
    Session:
      name: session
      in: query
      required: false
      description: Optional. Gültige Session-ID ersetzt ids durch removed. An IPv4-Adresse gebunden; Cleanup
        alle 5 s bei >30 s ohne validierten Zugriff. Nichtnumerisch wird wie keine Session behandelt, unbekannte
        numerische ID ergibt 302 /wrongsession. Nur modified.xml hält die Session am Leben.
      schema:
        type: integer
        format: int64
    Filter:
      name: filter
      in: query
      required: false
      description: 'Case-insensitive, durch Semikolon getrennt: ids, down, user, uploads, server, informations,
        search. Fehlt filter, werden alle Kategorien geliefert; leer/unbekannt = nur time. informations (Plural!)
        umfasst information und networkinfo; search auch searchentry. ids enthält Bestands- oder Löschlisten
        unabhängig vom timestamp.'
      schema:
        type: string
  responses:
    Redirect:
      description: '302 unknown mit leerem Körper. Fehlendes/falsches password: /wrongpassword. Unbekannter
        Pfad: /help. Ungültige Session bei modified.xml: /wrongsession. Content-Type fehlt bei unkomprimiertem
        Redirect.'
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/Access-Control-Allow-Methods'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/Access-Control-Allow-Headers'
        Server:
          $ref: '#/components/headers/Server'
        Content-Length:
          $ref: '#/components/headers/Content-Length'
        location:
          schema:
            type: string
            enum:
            - /wrongpassword
            - /wrongsession
            - /help
    Preflight:
      description: 200, kein Passwort nötig. Ohne mode=zip leerer Körper; Content-Type text/plain. Mit mode=zip
        leerer zlib-Stream, dennoch text/plain (früher Rücksprung vor Content-Type-Umschreibung).
      headers:
