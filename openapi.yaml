        erzeugt Grundbestand, time liefert nächsten Poll-Zeitpunkt. Share-Objekte fehlen immer; separat share.xml.
        Mit Session liefert ids-Filter removed und leert dessen Queue; ohne Session Bestandslisten. Filterunabhängig
        werden keine Löschlisten gesendet, wenn ids nicht angefordert wird. Informationsobjekte und Netzwerkstatistik
        werden jede Sekunde aktualisiert (Raten über tatsächlich verstrichene Zeit, Bytes/Sekunde). Ohne filter werden alle Kategorien gesendet, filter='' sendet nur time.
        Abfragen nach Session-Timeout neu initialisieren; kein Snapshot-/Replay-/Exactly-once-Versprechen.
      parameters:
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/Session'
      - $ref: '#/components/parameters/Filter'
      - $ref: '#/components/parameters/Mode'
      responses:
        '200':
          $ref: '#/components/responses/getModifiedResult'
        '302':
          $ref: '#/components/responses/Redirect'
    post:
      tags:
      - query
      summary: Änderungen und Zustandslisten abfragen (POST)
      operationId: getModifiedPost
      description: 'Delta-Polling nach Objekt-Änderungszeit (>=). Ausgabe-Reihenfolge nicht zugesichert. timestamp=0
        erzeugt Grundbestand, time liefert nächsten Poll-Zeitpunkt. Share-Objekte fehlen immer; separat share.xml.
