                  pattern: ^[0-9a-fA-F]{32}$
                  description: MD5 des Core-Passworts. POST-Formfeld alternativ zum Query-Parameter möglich;
                    Query-apiKey beschreibt den empfohlenen Weg. Formwert überschreibt gleichnamigen Query-Wert.
                    Kein Basic/Bearer/Cookie-Login.
