        weiterhin text/html). Sonst text/xml: ok, error: invalid md5checksum oder error: <message> (<class>).
        Authentifizierung noch mit altem password; danach neuen Hash verwenden.'
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/Access-Control-Allow-Methods'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/Access-Control-Allow-Headers'
        Server:
          $ref: '#/components/headers/Server'
        Content-Length:
          $ref: '#/components/headers/Content-Length'
      content:
        text/xml:
          schema:
            type: string
          example: ok
        application/zlib:
          schema:
            type: string
            format: binary
            description: zlib-Stream, kein ZIP-Archiv und kein gzip. Kein Content-Encoding-Header.
        text/html:
          schema:
            type: string
            format: binary
          example: 'error: unknown password'
    setSettingsResult:
      description: ok unter text/html; mode=zip komprimiert, weiterhin text/html. Ungültige Ganzzahl führt
        zu ungefangener Ausnahme und Verbindungsabbruch ohne reguläre HTTP-Antwort; vorherige Änderungen können
        bereits angewendet sein. Settings-Speicherfehler werden nur geloggt und nicht als HTTP-Fehler zurückgegeben.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/Access-Control-Allow-Methods'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/Access-Control-Allow-Headers'
        Server:
          $ref: '#/components/headers/Server'
        Content-Length:
          $ref: '#/components/headers/Content-Length'
      content:
        text/html:
          schema:
            type: string
            format: binary
          example: ok
    shareCheckResult:
      description: Klartext ok unter text/xml, auch wenn bereits ein Sharecheck läuft. Fortschritt ist nicht abfragbar.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/Access-Control-Allow-Methods'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/Access-Control-Allow-Headers'
        Server:
          $ref: '#/components/headers/Server'
        Content-Length:
          $ref: '#/components/headers/Content-Length'
      content:
        text/xml:
          schema:
            type: string
          example: ok
        application/zlib:
          schema:
            type: string
            format: binary
            description: zlib-Stream, kein ZIP-Archiv und kein gzip. Kein Content-Encoding-Header.
    stopShareCheckResult:
      description: Klartext ok unter text/xml, auch wenn kein Sharecheck läuft. Der Core unterscheidet das nicht.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/Access-Control-Allow-Methods'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/Access-Control-Allow-Headers'
        Server:
          $ref: '#/components/headers/Server'
        Content-Length:
          $ref: '#/components/headers/Content-Length'
      content:
        text/xml:
          schema:
            type: string
          example: ok
        application/zlib:
          schema:
            type: string
            format: binary
            description: zlib-Stream, kein ZIP-Archiv und kein gzip. Kein Content-Encoding-Header.
    exitCoreResult:
      description: ok unter text/xml; danach wird exit ausgeführt und Prozess beendet. Bei Rennen kann Verbindung
        auch vor vollständig gelesener Antwort enden.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/Access-Control-Allow-Methods'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/Access-Control-Allow-Headers'
        Server:
          $ref: '#/components/headers/Server'
        Content-Length:
          $ref: '#/components/headers/Content-Length'
      content:
        text/xml:
          schema:
            type: string
          example: ok
        application/zlib:
          schema:
            type: string
            format: binary
            description: zlib-Stream, kein ZIP-Archiv und kein gzip. Kein Content-Encoding-Header.
    helpResult:
      description: Öffentliche HTML-Seite, HTTP 200. mode=zip komprimiert auch hier, aber Content-Type bleibt
        text/html; Beispiel gekürzt, historische Links sind kein aktueller Support-Verweis.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/Access-Control-Allow-Methods'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/Access-Control-Allow-Headers'
        Server:
          $ref: '#/components/headers/Server'
        Content-Length:
          $ref: '#/components/headers/Content-Length'
      content:
        text/html:
          schema:
            type: string
            format: binary
          example: <html><body><h2>Help</h2></body></html>
    wrongpasswordResult:
      description: Öffentliche HTML-Seite, HTTP 200. mode=zip komprimiert auch hier, aber Content-Type bleibt
        text/html; Beispiel gekürzt, historische Links sind kein aktueller Support-Verweis.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/Access-Control-Allow-Methods'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/Access-Control-Allow-Headers'
        Server:
          $ref: '#/components/headers/Server'
        Content-Length:
          $ref: '#/components/headers/Content-Length'
      content:
        text/html:
          schema:
            type: string
            format: binary
          example: <html><body><p>wrong password. access denied.</p></body></html>
    wrongsessionResult:
      description: Öffentliche HTML-Seite, HTTP 200. mode=zip komprimiert auch hier, aber Content-Type bleibt
        text/html; Beispiel gekürzt, historische Links sind kein aktueller Support-Verweis.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/Access-Control-Allow-Origin'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/Access-Control-Allow-Methods'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/Access-Control-Allow-Headers'
        Server:
          $ref: '#/components/headers/Server'
        Content-Length:
          $ref: '#/components/headers/Content-Length'
      content:
        text/html:
          schema:
            type: string
            format: binary
          example: <html><body><p>wrong session. access denied.</p></body></html>
  schemas:
    Filesystem:
      type: object
      xml:
        name: filesystem
      properties:
        seperator:
          type: string
          description: Pfadtrenner. Historische Schreibweise `seperator` ist Teil der API.
          xml:
            attribute: true
      required:
      - seperator
    GeneralInformation:
      type: object
      xml:
        name: applejuice
      properties:
        generalinformation:
          type: object
          xml:
            name: generalinformation
          properties:
            version:
              type: string
              description: Core-Version; nicht die Binärprotokoll-Version.
            filesystem:
              $ref: '#/components/schemas/Filesystem'
            system:
              type: string
              description: Name des Betriebssystems (zum Beispiel Linux).
          required:
          - version
          - filesystem
          - system
      required:
      - generalinformation
    SessionResponse:
      type: object
      xml:
        name: applejuice
      properties:
        session:
          type: object
          xml:
            name: session
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
              description: Zufällig erzeugte, positive Session-ID; an IPv4-Adresse des Clients gebunden.
              xml:
                attribute: true
          required:
          - id
      required:
      - session
    Directory:
      type: object
      xml:
        name: dir
      properties:
        name:
          type: string
          description: Anzeigename; unter Unix ohne path aus Elternverzeichnis + Trenner zusammensetzen.
          xml:
            attribute: true
        path:
          type: string
          description: Optionaler vollständiger oder Windows-Shell-Pfad. Kann fehlen.
          xml:
            attribute: true
        isfilesystem:
          type: boolean
          xml:
            attribute: true
        type:
          type: integer
          format: int64
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          description: 1 Rechner, 2 Laufwerk, 3 Diskettenlaufwerk, 4 Ordner, 5 Desktop.
          xml:
            attribute: true
        dir:
          type: array
          xml:
            name: dir
            wrapped: false
          items:
            $ref: '#/components/schemas/Directory'
      required:
      - name
      - isfilesystem
      - type
    DirectoryResponse:
      type: object
      xml:
        name: applejuice
      properties:
        filesystem:
          $ref: '#/components/schemas/Filesystem'
        dir:
          type: array
          xml:
            name: dir
            wrapped: false
          items:
            $ref: '#/components/schemas/Directory'
      description: Nur Verzeichnisse, keine Dateien. Unter Windows sind verschachtelte dir-Elemente möglich.
      required:
      - filesystem
    Part:
      type: object
      xml:
        name: part
      properties:
        fromposition:
          type: integer
          format: int64
          minimum: 0
          description: Start in Bytes. Ende ist nächster Start oder filesize.
          xml:
            attribute: true
        type:
          type: integer
          format: int64
          minimum: -1
          description: -1 lokal vorhanden; 0 unbekannt/nicht vorhanden; positive Zahl = bekannte Quellen. Der Zähler ist nicht auf 10 begrenzt. userpartlist liefert nur -1
            oder 0.
          xml:
            attribute: true
      required:
      - fromposition
      - type
    PartListResponse:
      type: object
      xml:
        name: applejuice
      properties:
        fileinformation:
          type: object
          xml:
            name: fileinformation
          properties:
            filesize:
              type: integer
              format: int64
              description: Bytezahl; als 64-Bit-Wert lesen, nicht auf 32 Bit begrenzen.
              xml:
                attribute: true
          required:
          - filesize
        part:
          type: array
          xml:
            name: part
            wrapped: false
          items:
            $ref: '#/components/schemas/Part'
      description: Stückweise Verfügbarkeitskarte; keine Liste einzelner fester Download-Blöcke.
      required:
      - fileinformation
    Share:
      type: object
      xml:
        name: share
      properties:
        id:
          type: integer
          format: int64
          description: Core-Objekt-ID; nur innerhalb dieser Core-Laufzeit gültig.
          xml:
            attribute: true
        filename:
          type: string
          description: Vollständiger Dateipfad im Core-Dateisystem.
          xml:
            attribute: true
        shortfilename:
          type: string
          description: Dateiname ohne Pfad.
          xml:
            attribute: true
        size:
          type: integer
          format: int64
          description: Bytezahl; als 64-Bit-Wert lesen, nicht auf 32 Bit begrenzen.
          xml:
            attribute: true
        checksum:
          type: string
          pattern: ^[0-9a-fA-F]{32}$
          description: MD5-Hash als 32 Hex-Zeichen.
          xml:
            attribute: true
        priority:
          type: integer
          format: int64
          description: Share-Priorität 1..250; Gesamtpriorität darf beim Setzen 1000 nicht überschreiten.
          xml:
            attribute: true
        lastasked:
          type: integer
          format: int64
          description: Unix-Zeit in Millisekunden; 0 wenn noch nicht gesetzt.
          xml:
            attribute: true
        askcount:
          type: integer
          format: int64
          description: Anzahl der Anfragen.
          xml:
            attribute: true
        searchcount:
          type: integer
          format: int64
          description: Anzahl Suchtreffer.
          xml:
            attribute: true
      required:
      - id
      - filename
      - shortfilename
      - size
      - checksum
      - priority
      - lastasked
      - askcount
      - searchcount
    ShareResponse:
      type: object
      xml:
        name: applejuice
      properties:
        shares:
          type: object
          xml:
            name: shares
          properties:
            share:
              type: array
              xml:
                name: share
                wrapped: false
              items:
                $ref: '#/components/schemas/Share'
      required:
      - shares
    SettingsResponse:
      type: object
      xml:
        name: settings
      properties:
        nick:
          type: string
          description: Nickname; Ausgabe heißt nick, Setter-Parameter nickname.
        port:
          type: integer
          format: int64
          description: Core-TCP-Port.
        xmlport:
          type: integer
          format: int64
          description: HTTP/XML-Port.
        autoconnect:
          type: boolean
        maxupload:
          type: integer
          format: int64
          description: Übertragungsrate in Bytes/Sekunde.
        maxdownload:
          type: integer
          format: int64
          description: Bytes/Sekunde; 0 = unbegrenzt.
        maxconnections:
          type: integer
          format: int64
          description: Maximale gleichzeitige Verbindungen.
        maxsourcesperfile:
          type: integer
          format: int64
          description: Maximale Quellen je Datei.
        speedperslot:
          type: integer
          format: int64
          description: Angepeilte Uploadgeschwindigkeit je Slot in KiB/Sekunde.
        maxnewconnectionsperturn:
          type: integer
          format: int64
          description: Maximale neue Verbindungen je 10 Sekunden.
        incomingdirectory:
          type: string
          description: Incoming-Verzeichnis, im Core-Dateisystem.
        temporarydirectory:
          type: string
          description: Temporäres Verzeichnis, im Core-Dateisystem.
        share:
          type: object
          xml:
            name: share
          properties:
            directory:
              type: array
              xml:
                name: directory
                wrapped: false
              items:
                type: object
                xml:
                  name: directory
                properties:
                  name:
                    type: string
                    description: Verzeichnispfad.
                    xml:
                      attribute: true
                  sharemode:
                    type: string
                    enum:
                    - subdirectory
                    - singledirectory
                    description: Mit bzw. ohne Unterverzeichnisse.
                    xml:
                      attribute: true
                required:
                - name
                - sharemode
      required:
      - nick
      - port
      - xmlport
      - autoconnect
      - maxupload
      - maxdownload
      - maxconnections
      - maxsourcesperfile
      - speedperslot
      - maxnewconnectionsperturn
      - incomingdirectory
      - temporarydirectory
      - share
      description: Eigene Wurzel settings, nicht applejuice. Das Passwort wird nicht ausgegeben.
    Download:
      type: object
      xml:
        name: download
      properties:
        id:
          type: integer
          format: int64
          description: Core-Objekt-ID; nur innerhalb dieser Core-Laufzeit gültig.
          xml:
            attribute: true
        shareid:
          type: integer
          format: int64
          description: Share-ID, oder -1 solange noch kein Share besteht. Der Core legt ihn an, sobald Daten ankommen
            (filename = Temp-Verzeichnis + temporaryfilenumber + .data, shortfilename = Downloadname) oder nutzt einen
            vorhandenen Share mit gleichem Hash und gleicher Größe. Nach Abbruch ist der Wert wieder -1.
          xml:
            attribute: true
        hash:
          type: string
          pattern: ^[0-9a-fA-F]{32}$
          description: MD5-Hash als 32 Hex-Zeichen.
          xml:
            attribute: true
        size:
          type: integer
          format: int64
          description: Bytezahl; als 64-Bit-Wert lesen, nicht auf 32 Bit begrenzen.
          xml:
            attribute: true
        status:
          type: integer
          format: int64
          description: 'Codes: 0 suchen/laden, 1 zu wenig Platz, 12 fertigstellen, 13 Fehler beim Fertigstellen,
            14 fertig, 15 abbrechen, 16 Datei erstellen, 17 abgebrochen, 18 pausiert. Weitere Werte nicht ausschließen.'
          xml:
            attribute: true
        powerdownload:
          type: integer
          format: int64
          description: 0 oder 12..490; 12 entspricht 1:2,2, 490 entspricht 1:50.
          xml:
            attribute: true
        temporaryfilenumber:
          type: integer
          format: int64
          description: Nummer der temporären Part-Datei.
          xml:
            attribute: true
        filename:
          type: string
          xml:
            attribute: true
        targetdirectory:
          type: string
          description: Ziel relativ zu Incoming.
          xml:
            attribute: true
        ready:
          type: integer
          format: int64
          description: Bytezahl; als 64-Bit-Wert lesen, nicht auf 32 Bit begrenzen.
          xml:
            attribute: true
      required:
      - id
      - shareid
      - hash
      - size
      - status
      - powerdownload
      - temporaryfilenumber
      - filename
      - targetdirectory
      - ready
    User:
      type: object
      xml:
        name: user
      properties:
        id:
          type: integer
          format: int64
          description: Core-Objekt-ID; nur innerhalb dieser Core-Laufzeit gültig.
          xml:
            attribute: true
        source:
          type: integer
          format: int64
          description: 1 ajfsp, 2 Client-zu-Client, 3 Uploadliste, 4 letzter Start, 5 Textsuche, 6 Serversuche
            (Codes).
          xml:
            attribute: true
        downloadid:
          type: integer
          format: int64
          description: Core-Objekt-ID; nur innerhalb dieser Core-Laufzeit gültig.
          xml:
            attribute: true
        status:
          type: integer
          format: int64
          description: 'Codes: 1 ungefragt, 2 verbinden, 3 alte Version, 4 Datei nicht öffnbar, 5 Warteschlange,
            6 keine brauchbaren Parts, 7 Transfer, 8 kein Platz, 9 fertig, 11 keine Verbindung, 12 indirekt
            versuchen, 13 pausiert, 14 Queue voll, 15 eigenes Limit, 16 indirekt abgelehnt.'
          xml:
            attribute: true
        directstate:
          type: integer
          format: int64
          description: 0 unbekannt, 1 direkt, 2 indirekt unbestätigt, 3 indirekt (Codes).
          xml:
            attribute: true
        downloadfrom:
          type: integer
          format: int64
          description: Byteposition im Objekt; -1 kann 'noch keine Position' bedeuten.
          xml:
            attribute: true
        downloadto:
          type: integer
          format: int64
          description: Byteposition im Objekt; -1 kann 'noch keine Position' bedeuten.
          xml:
            attribute: true
        actualdownloadposition:
          type: integer
          format: int64
          description: Byteposition im Objekt; -1 kann 'noch keine Position' bedeuten.
          xml:
            attribute: true
        speed:
          type: integer
          format: int64
          description: Übertragungsrate in Bytes/Sekunde.
          xml:
            attribute: true
        version:
          type: string
          xml:
            attribute: true
        operatingsystem:
          type: integer
          format: int64
          description: 'Codes: 0 unbekannt, 1 Windows, 2 Linux, 3 Macintosh, 4 Solaris, 5 OS/2, 6 FreeBSD,
            7 NetWare.'
          xml:
            attribute: true
        queueposition:
          type: integer
          format: int64
          description: Position in Warteschlange.
          xml:
            attribute: true
        powerdownload:
          type: integer
          format: int64
          xml:
            attribute: true
        filename:
          type: string
          xml:
            attribute: true
        nickname:
          type: string
          xml:
            attribute: true
      required:
      - id
      - source
      - downloadid
      - status
      - directstate
      - downloadfrom
      - downloadto
      - actualdownloadposition
      - speed
      - version
      - operatingsystem
      - queueposition
      - powerdownload
      - filename
      - nickname
    Upload:
      type: object
      xml:
        name: upload
      properties:
        id:
          type: integer
          format: int64
          description: Core-Objekt-ID; nur innerhalb dieser Core-Laufzeit gültig.
          xml:
            attribute: true
        shareid:
          type: integer
          format: int64
          description: Core-Objekt-ID; nur innerhalb dieser Core-Laufzeit gültig.
          xml:
            attribute: true
        version:
          type: string
          xml:
            attribute: true
        operatingsystem:
          type: integer
          format: int64
          description: Gleiche OS-Codes wie user.
          xml:
            attribute: true
        status:
          type: integer
          format: int64
          description: 'Codes: 1 aktive Übertragung, 2 Warteschlange.'
          xml:
            attribute: true
        directstate:
          type: integer
          format: int64
          description: 'Codes für Upload: 0 unbekannt, 1 direkt, 2 indirekt. Nicht mit User-Codes verwechseln.'
          xml:
            attribute: true
        priority:
          type: integer
          format: int64
          description: Vom Core berechnete Uploadpriorität; kein direkt setzbarer Share-Prioritätswert.
          xml:
            attribute: true
        nick:
          type: string
          description: Anzeige-Nickname; heißt nick, nicht nickname.
          xml:
            attribute: true
        uploadfrom:
          type: integer
          format: int64
          description: Byteposition im Objekt; -1 kann 'noch keine Position' bedeuten.
          xml:
            attribute: true
        actualuploadposition:
          type: integer
          format: int64
          description: Byteposition im Objekt; -1 kann 'noch keine Position' bedeuten.
          xml:
            attribute: true
        uploadto:
          type: integer
          format: int64
          description: Byteposition im Objekt; -1 kann 'noch keine Position' bedeuten.
          xml:
            attribute: true
        lastconnection:
          type: integer
          format: int64
          description: Unix-Zeit in Millisekunden; 0 wenn noch nicht gesetzt.
          xml:
            attribute: true
        speed:
          type: integer
          format: int64
          description: Übertragungsrate in Bytes/Sekunde.
          xml:
            attribute: true
        loaded:
          type: number
          format: double
          description: Remote-Fortschritt in Prozent (0..100); -1.0, solange der Client keinen Wert gemeldet hat.
          xml:
            attribute: true
      required:
      - id
      - shareid
      - version
      - operatingsystem
      - status
      - directstate
      - priority
      - nick
      - uploadfrom
      - actualuploadposition
      - uploadto
      - lastconnection
      - speed
      - loaded
    Server:
      type: object
      xml:
        name: server
      properties:
        id:
          type: integer
          format: int64
          description: Core-Objekt-ID; nur innerhalb dieser Core-Laufzeit gültig.
          xml:
            attribute: true
        name:
          type: string
          xml:
            attribute: true
        host:
          type: string
          xml:
            attribute: true
        lastseen:
          type: integer
          format: int64
          description: Unix-Zeit in Millisekunden; 0 wenn noch nicht gesetzt.
          xml:
            attribute: true
        port:
          type: integer
          format: int64
          xml:
            attribute: true
        connectiontry:
          type: integer
          format: int64
          description: Anzahl der Verbindungsversuche.
          xml:
            attribute: true
      required:
      - id
      - name
      - host
      - lastseen
      - port
      - connectiontry
    Search:
      type: object
      xml:
        name: search
      properties:
        id:
          type: integer
          format: int64
          description: Core-Objekt-ID; nur innerhalb dieser Core-Laufzeit gültig.
          xml:
            attribute: true
        searchtext:
          type: string
          description: Suchtext. Aktueller Core escaped diesen Attributwert nicht; Sonderzeichen können ungültiges
            XML erzeugen.
          xml:
            attribute: true
        opensearches:
          type: integer
          format: int64
          xml:
            attribute: true
        foundfiles:
          type: integer
          format: int64
          xml:
            attribute: true
        sumsearches:
          type: integer
          format: int64
          xml:
            attribute: true
        running:
          type: boolean
          xml:
            attribute: true
      required:
      - id
      - searchtext
      - opensearches
      - foundfiles
      - sumsearches
      - running
    SearchEntry:
      type: object
      xml:
        name: searchentry
      properties:
        id:
          type: integer
          format: int64
          description: Core-Objekt-ID; nur innerhalb dieser Core-Laufzeit gültig.
          xml:
            attribute: true
        searchid:
          type: integer
          format: int64
          description: Core-Objekt-ID; nur innerhalb dieser Core-Laufzeit gültig.
          xml:
            attribute: true
        checksum:
          type: string
          pattern: ^[0-9a-fA-F]{32}$
          description: MD5-Hash als 32 Hex-Zeichen.
          xml:
            attribute: true
        size:
          type: integer
          format: int64
          description: Bytezahl; als 64-Bit-Wert lesen, nicht auf 32 Bit begrenzen.
          xml:
            attribute: true
        filename:
          type: array
          xml:
            name: filename
            wrapped: false
          items:
            type: object
            xml:
              name: filename
            properties:
              name:
                type: string
                xml:
                  attribute: true
              user:
                type: integer
                format: int64
                description: Anzahl Quellen für genau diesen Namen; keine Objekt-ID.
                xml:
                  attribute: true
            required:
            - name
            - user
      required:
      - id
      - searchid
      - checksum
      - size
    Information:
      type: object
      xml:
        name: information
      properties:
        credits:
          type: integer
          format: int64
          description: Aktuelle Credits in Bytes, vom Core auf ganzzahligen Dezimaltext gerundet.
          xml:
            attribute: true
        sessionupload:
          type: integer
          format: int64
          description: Bytezahl; als 64-Bit-Wert lesen, nicht auf 32 Bit begrenzen.
          xml:
            attribute: true
        sessiondownload:
          type: integer
          format: int64
          description: Bytezahl; als 64-Bit-Wert lesen, nicht auf 32 Bit begrenzen.
          xml:
            attribute: true
        uploadspeed:
          type: integer
          format: int64
          description: Übertragungsrate in Bytes/Sekunde.
          xml:
            attribute: true
        downloadspeed:
          type: integer
          format: int64
          description: Übertragungsrate in Bytes/Sekunde.
          xml:
            attribute: true
        openconnections:
          type: integer
          format: int64
          xml:
            attribute: true
        maxuploadpositions:
          type: integer
          format: int64
          xml:
            attribute: true
      required:
      - credits
      - sessionupload
      - sessiondownload
      - uploadspeed
      - downloadspeed
      - openconnections
      - maxuploadpositions
      description: Hat kein id-Attribut.
    NetworkInfo:
      type: object
      xml:
        name: networkinfo
      properties:
        users:
          type: integer
          format: int64
          xml:
            attribute: true
        files:
          type: integer
          format: int64
          xml:
            attribute: true
        filesize:
          type: string
          description: Gesamtgröße in GB, DecimalFormat 0.00 mit Laufzeit-Locale; Punkt oder Komma möglich.
            Kein Bytewert.
          xml:
            attribute: true
        firewalled:
          type: boolean
          xml:
            attribute: true
        ip:
          type: string
          description: Externe IPv4-Adresse, 0.0.0.0 wenn unbekannt.
          xml:
            attribute: true
        tryconnecttoserver:
          type: integer
          format: int64
          description: Server-ID des Verbindungsversuchs oder -1.
          xml:
            attribute: true
        connectedwithserverid:
          type: integer
          format: int64
          description: Verbundener Server oder -1.
          xml:
            attribute: true
        connectedsince:
          type: integer
          format: int64
          description: Unix-Zeit in Millisekunden; 0 wenn noch nicht gesetzt.
          xml:
            attribute: true
        paused:
          type: boolean
          xml:
            attribute: true
        welcomemessage:
          type: string
          description: Server-Willkommenstext; kann umgebende Zeilenumbrüche enthalten.
      required:
      - users
      - files
      - filesize
      - firewalled
      - ip
      - tryconnecttoserver
      - connectedwithserverid
      - connectedsince
      - paused
      - welcomemessage
      description: Keine id. Enthält welcomemessage als XML-Textknoten (escaped).
    IdRef:
      type: object
      xml:
        name: object
      properties:
