      x-core-form-password-supported: true
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                timestamp:
                  type: integer
                  format: int64
                  default: 0
                  description: Millisekunden seit Unix-Epoche; ungültig/fehlend = 0. Objekte mit Änderungszeit
                    >= timestamp (inklusiv). time der letzten Antwort beim nächsten Poll senden.
                session:
                  type: integer
                  format: int64
                  description: Optional. Gültige Session-ID ersetzt ids durch removed. An IPv4-Adresse gebunden;
                    Cleanup alle 5 s bei >30 s ohne validierten Zugriff. Nichtnumerisch wird wie keine Session
                    behandelt, unbekannte numerische ID ergibt 302 /wrongsession. Nur modified.xml hält die
                    Session am Leben.
                filter:
                  type: string
                  description: 'Case-insensitive, durch Semikolon getrennt: ids, down, user, uploads, server,
                    informations, search. Fehlt filter, werden alle Kategorien geliefert; leer/unbekannt =
                    nur time. informations (Plural!) umfasst information und networkinfo; search auch searchentry.
                    ids enthält Bestands- oder Löschlisten unabhängig vom timestamp.'
                mode:
                  type: string
                  description: Nur case-insensitive zip aktiviert zlib; alle anderen Werte werden ignoriert.
                password:
