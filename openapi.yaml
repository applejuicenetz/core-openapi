openapi: 3.0.3
info:
  title: appleJuice Core HTTP/XML API
  version: 0.1.0
  description: 'Quellcodebasierte Dokumentation aller 9 XML-Abfragen, 16 Aktionspfade und 3 öffentlichen HTML-Pfade
    des Core. Kein REST-Gateway. GET, POST und OPTIONS beschrieben; OPTIONS auf beliebigen Pfaden vor Authentifizierung
    behandelt. Andere HTTP-Methoden werden ebenfalls nicht verworfen, haben außer OPTIONS aber keine
    eigene Semantik und sind nicht empfohlen.


    Standardport 9851. TCP-Verbindungen von genau 127.0.0.1 sind auch bei leerem Core-Passwort erlaubt; andere
    Adressen nur bei gesetztem Passwort. Das ersetzt keine HTTP-Authentifizierung: password
    muss MD5 des Passworts sein, auch MD5 des leeren Passworts bei localhost. Empfohlen ist der Header
    X-AppleJuice-Password; ohne Header bleibt der Parameter password in Query oder POST-Form gültig.
    Ein vorhandener Header hat immer Vorrang, auch wenn er leer oder falsch ist. Basic/Bearer/Cookie-Auth werden
    nicht für die Core-API verwendet. Der Core hat keinen eingebauten TLS-Listener. Passworthash ist ein wiederverwendbares
    Geheimnis: nicht loggen, nicht öffentlich im URL-Beispiel verwenden. Remote nur über geschützten Transport
    verwenden.


    Pfadsegmente und Parameternamen case-insensitive. Werte URL-dekodiert (UTF-8, ''+'' wird Leerzeichen),
    Parameternamen nicht URL-dekodiert. Wiederholte Namen: letzter Wert gewinnt, POST-Form überschreibt Query.
    Paare ohne ''='' ignoriert. Ausgewertet werden nur erste 1 bzw. 2 Pfadsegmente, zusätzliche Segmente werden
    nicht validiert. Unbekannter Pfad mit gültigem Passwort: 302 /help; ohne gültiges Passwort: 302 /wrongpassword.
    Leere und fehlerhafte Pfade können Verbindungsabbrüche statt HTTP-Fehlern erzeugen.


    Antworten: text/xml für XML und manche Klartexte; text/html für andere Klartexte und HTML. Funktionale
    Fehler meist 200, Auth/Session-Fehler 302 unknown mit leerem Körper, keine 401/404. Redirects nicht automatisch
    als Erfolg behandeln. Ungefangene Ausnahmen können die TCP-Verbindung ohne Antwort schließen; ein HTTP-500
    ist dann nicht garantiert. Malformierte HTTP-Requestline wird mit 500 beantwortet. Response-Header
    nutzen LF statt standardmäßiger CRLF. XML-Bytes nutzen den Standardzeichensatz der Laufzeit, Requestwerte UTF-8; typischerweise
    UTF-8, nicht durch XML-Deklaration/Content-Type erzwungen.


    mode=zip (case-insensitive): zlib-Stream, kein ZIP/gzip und kein Content-Encoding. Falls
    der Core Content-Type gesetzt hat, wird er zu application/zlib umgeschrieben, auch bei Klartext. Andernfalls
    setzt HTTP-Schicht nachher text/html, obwohl Körper komprimiert ist. OPTIONS kehrt vor Umschreibung zurück,
    behält text/plain. Die komprimierten Varianten stehen in den Antwortschemas; statische Swagger/ReDoc-Beispiele
    modellieren Bytes nicht als XML.


    OpenAPI-Grenzen: offene Indexparameter id1..idN/sharedirectory1..N/sharesub1..N können nicht als endliche
    Parameterliste beschrieben werden; id1/sharedirectory1/sharesub1 sind Stellvertreter, x-core-indexed-parameters
    erklärt Iteration. POST-Passwort im Formkörper wird akzeptiert, während apiKey-Security für den empfohlenen
    Header- oder kompatiblen Query-Transport steht (x-core-form-password-supported). Gemischte XML-Geschwisterreihenfolge, teilweise
    kaputtes XML nach Laufzeitfehlern und Verbindungsabbrüche bleiben textuell beschrieben. Kein generierter
    Client darf daraus eine moderne fehlerfreie REST-Semantik ableiten.'
servers:
- url: http://127.0.0.1:{port}
  description: Lokaler Core; Host/Port an eigene Installation anpassen.
  variables:
    port:
      default: '9851'
      description: XML-Port aus Core-Settings.
security:
- PasswordHeader: []
- PasswordQuery: []
tags:
- name: query
  description: XML-Abfragen; Session- und Delta-Synchronisation.
- name: function
  description: Zustandsänderungen auch per GET; nicht automatisch wiederholen.
- name: http
  description: Öffentliche Hilfsseiten und CORS-Preflight.
paths:
  /xml/information.xml:
    get:
      tags:
      - query
      summary: Statische Core-Informationen
      operationId: getInformation
      description: Statische Core-Informationen
      parameters:
      - $ref: '#/components/parameters/Mode'
      responses:
        '200':
          $ref: '#/components/responses/getInformationResult'
        '302':
          $ref: '#/components/responses/Redirect'
    post:
      tags:
      - query
      summary: Statische Core-Informationen (POST)
      operationId: getInformationPost
      description: 'Statische Core-Informationen

        POST akzeptiert dieselben Query-Parameter wie GET. Zusätzlich optionaler Formkörper; Header muss exakt
        application/x-www-form-urlencoded sein (case-insensitive, ohne charset). Formwerte überschreiben Query-Werte.
        JSON/Multipart/andere Typen werden nicht ausgewertet. Nur Content-Length-Body, kein Chunked-Encoding.'
      parameters:
      - $ref: '#/components/parameters/Mode'
      responses:
        '200':
          $ref: '#/components/responses/getInformationResult'
        '302':
          $ref: '#/components/responses/Redirect'
      x-core-form-password-supported: true
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  description: Nur case-insensitive zip aktiviert zlib; alle anderen Werte werden ignoriert.
                password:
                  type: string
                  pattern: ^[0-9a-fA-F]{32}$
                  description: MD5 des Core-Passworts. POST-Formfeld alternativ zum Query-Parameter möglich;
                    Query-apiKey beschreibt den empfohlenen Weg. Formwert überschreibt gleichnamigen Query-Wert.
                    Kein Basic/Bearer/Cookie-Login.
    options:
      tags:
      - http
      summary: CORS-Preflight (ohne Authentifizierung)
      operationId: getInformationOptions
      description: OPTIONS wird vor Authentifizierung und Routing behandelt; gleiches Verhalten auch auf unbekannten
        Pfaden. TCP-Zugangsbeschränkung gilt weiterhin.
      security: []
      parameters:
      - $ref: '#/components/parameters/Mode'
      responses:
        '200':
          $ref: '#/components/responses/Preflight'
