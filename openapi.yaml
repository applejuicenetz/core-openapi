        werden jede Sekunde aktualisiert (Raten über tatsächlich verstrichene Zeit, Bytes/Sekunde). Ohne filter werden alle Kategorien gesendet, filter='''' sendet nur
        time. Abfragen nach Session-Timeout neu initialisieren; kein Snapshot-/Replay-/Exactly-once-Versprechen.

        POST akzeptiert dieselben Query-Parameter wie GET. Zusätzlich optionaler Formkörper; Header muss exakt
        application/x-www-form-urlencoded sein (case-insensitive, ohne charset). Formwerte überschreiben Query-Werte.
        JSON/Multipart/andere Typen werden nicht ausgewertet. Nur Content-Length-Body, kein Chunked-Encoding.'
      parameters:
      - $ref: '#/components/parameters/Timestamp'
      - $ref: '#/components/parameters/Session'
      - $ref: '#/components/parameters/Filter'
      - $ref: '#/components/parameters/Mode'
